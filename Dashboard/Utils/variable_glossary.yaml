n_de_jce_de_la_institucion_que_trabajan_en_1_o_mas_instituciones_en_1_institucion:
  dimension: "JCE"
  nombre: "Académicos JCE exclusivos de la institución"
  descripcion: "Cantidad de jornadas completas equivalentes (JCE) de académicos de la institución que trabajan solo en esa institución (no comparten su jornada con otras universidades)."
  calculo: "Conteo directo desde la hoja PAC de JCE por institución, sin ponderación adicional por matrícula (constante dentro de la IES, se repite en todas sus APDAs)."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "N° de jornadas (JCE)"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada 2026-08-13: como conteo crudo, escala con el tamaño de la institución en vez de con la exclusividad real (una IES grande gana en headcount aunque una porción menor de su JCE sea exclusiva). Reemplazada por pct_jce_1inst (mismo numerador, dividido por el JCE total institucional). Al ser un valor institucional (no varía entre APDAs de la misma IES), no discrimina entre APDAs de una misma institución."

pct_jce_1inst:
  dimension: "JCE"
  origen: "creada"
  nombre: "% JCE exclusivo de la institución (constante institucional)"
  descripcion: "Qué porcentaje del JCE total de la institución corresponde a académicos que trabajan solo en esa institución (no comparten su jornada con otras universidades). Constante por IES — se repite en las cuatro celdas IES×APDA de una misma institución, porque PAC no reporta esta desagregación por área del conocimiento."
  calculo: "n_de_jce_de_la_institucion_que_trabajan_en_1_o_mas_instituciones_en_1_institucion / n_de_jce_por_institucion_total_general × 100. Exploration and data completion/Exp_SIES.py (bloque 'JCE weights'). Constante dentro de IES → agregada por 'first' en Utils/data_prep.py::aggregate_ies_apda_rich."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "% (0-100)"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Reemplaza al conteo crudo n_de_jce_de_la_institucion_que_trabajan_en_1_o_mas_instituciones_en_1_institucion desde el 13-08-2026 — mismo numerador, ahora expresado como proporción del JCE institucional total en vez de headcount absoluto. Comentada de nuevo 2026-08-13 en ambos config.yaml (branches) por decisión del usuario, sin reemplazo activo."

jce_por_estudiantes:
  dimension: "JCE"
  origen: "creada"
  nombre: "JCE por estudiante (constante institucional)"
  nombre_corto: "JCE por estudiante"
  descripcion: "Cuántas jornadas completas equivalentes (JCE) de académicos tiene la institución por cada estudiante matriculado. Razón cruda (no expresada como %), a diferencia de pct_jce_doctor/magister/especialidad/academicos_39, que son composición interna del JCE. Constante por IES: se repite en las cuatro celdas IES×APDA de una misma institución."
  calculo: "n_de_jce_por_institucion_total_general / matrícula total institucional, excluyendo Postítulo del denominador pero manteniendo Especialidad Médica u Odontológica (que 'nivel global'=='Postítulo' absorbería incorrectamente si no se excluye explícitamente vía 'nivel carrera'). Exploration and data completion/Exp_SIES.py (bloque 'JCE weights'). Constante dentro de IES → agregada por 'first' en Utils/data_prep.py::aggregate_ies_apda_rich."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE; matrícula desde SIES mat/of."
  unidad: "razón (JCE / estudiante)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Agregada 2026-08-13 a pedido del usuario — primera variable JCE que mide intensidad de dotación relativa a matrícula, en vez de composición interna del JCE."

paridad_jce:
  dimension: "JCE"
  origen: "creada"
  nombre: "Paridad de género — dotación JCE"
  descripcion: "Qué tan equilibrada está la dotación de jornadas completas equivalentes (JCE) de la institución entre hombres y mujeres. Máximo cuando la participación femenina está entre 40% y 60%."
  calculo: "Participación femenina = suma JCE mujeres / (suma JCE mujeres + suma JCE hombres) por celda, banda trapezoidal 40-60%. Utils/data_prep.py::add_parity_scores/_parity_score, líneas 460-521."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "score 0-100"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Reemplazó a n_de_jce_por_institucion_total_hombres/mujeres como par de variables independientes, por la misma razón que paridad_matricula: penaliza el desequilibrio en vez de premiar linealmente un solo sexo. Comentada en dimensions de Vector/config.yaml y Archetypes/config.yaml el 2026-08-18."

w_mat:
  dimension: "JCE"
  nombre: "Dotación docente total (JCE), ponderada por matrícula"
  descripcion: "Proxy de esfuerzo académico total de la institución asignado al programa, proporcional a cuánta matrícula concentra ese programa dentro de la IES. Desde el 28-07-2026 el allocator excluye matrícula Postítulo (no es un nivel de titulación) y se amortigua por n_apda_activas — instituciones con pocas APDAs activas antes recibían una participación inflada de su propio JCE en cada una de ellas (corr. con cobertura de APDA: 0.255 → 0.093 en producción). Es una corrección parcial, no completa — instituciones más grandes/comprehensivas genuinemente tienden a tener más JCE total y más cobertura a la vez (correlación de tamaño con cobertura ≈0.5), así que algo de correlación residual es real, no un artefacto de fórmula."
  calculo: "JCE total de la institución × _allocator, donde _allocator = (matrícula del programa, excl. Postítulo / matrícula total de la IES, excl. Postítulo) / n_apda_activas; reescalada 0-100. Exploration and data completion/Exp_SIES.py, líneas 675-778."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "índice 0-100"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Comentada el 29-07-2026 de dimensions.JCE en ambos config.yaml, mientras no exista un diagnóstico definitivo para los problemas del esquema de ponderación JCE (cobertura de APDAs, inflación por baja diversificación, etc.) — ver carpeta Inspection JCE/. Se mantiene calculada en el pipeline y en los CSV, sólo excluida del puntaje del modelo."

promedio_puntaje:
