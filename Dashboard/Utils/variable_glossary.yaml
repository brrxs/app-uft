# =============================================================================
# Utils/variable_glossary.yaml — Glosario de variables (Vector + Archetypes)
# =============================================================================
# Fuente única de verdad para la documentación de variables en español.
# Consumido por:
#   - Dashboard/export_variable_glossary.py  -> genera docs/glosario_variables.md
#   - Dashboard/build_dashboard.py           -> tooltips (ícono ⓘ) en el dashboard
#
# Cada entrada usa exactamente el nombre de columna tal como aparece en
# Vector/config.yaml y Archetypes/config.yaml (activo o comentado).
#
# Campos:
#   dimension    — dimensión a la que pertenece (o pertenecía) en los config.yaml
#   origen       — opcional: creada | recolectada. "recolectada" = tomada tal cual
#                  (o con rename/agregación simple: suma, promedio, conteo) de UNA
#                  sola columna cruda; "creada" = calculada combinando varios campos
#                  en un concepto nuevo (razón, %, índice, banda). Solo poblado para
#                  variables activas por ahora (ver Dashboard/export_variables.py).
#   nombre       — nombre legible en español
#   nombre_corto — opcional: nombre corto ("showcase") para mostrar en UI/reportes
#                  (dashboard, exports) en vez del nombre de columna técnico. Más
#                  corto y limpio que `nombre`, que sigue siendo la versión completa
#                  usada en tooltips/glosario. Solo poblado para variables activas
#                  (ver Utils/variable_labels.py, consumido por Dashboard/).
#   descripcion  — qué mide la variable (1-3 oraciones)
#   calculo      — fórmula/lógica de derivación (agregación, filtros, normalización)
#   fuente       — archivo/fuente de datos crudos de origen
#   unidad       — unidad o escala de la variable
#   orientacion  — mayor_es_mejor | menor_es_mejor (espeja direction: -1)
#   estado       — activa | retirada
#   notas        — opcional: coberturas parciales, motivo de retiro, etc.
# =============================================================================

"total matrícula primer año":
  dimension: "Tasa ocupación"
  origen: "recolectada"
  nombre: "Matrícula de primer año"
  descripcion: "Cantidad de estudiantes nuevos matriculados en primer año en los programas de Pregrado de la APDA, dentro de una institución."
  calculo: "Suma de 'total matrícula primer año' (SIES Matrícula) a nivel programa, restringida a nivel global == 'Pregrado', sumada (no promediada) dentro de la celda IES×APDA (Utils/data_prep.py::load_universe, máscara Pregrado; agregación en aggregate_ies_apda_rich, SUM_FEATS)."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv"
  unidad: "N° de estudiantes"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Corregida 2026-08-17: hasta entonces se agregaba con media simple dentro de la celda IES×APDA (sum(programas)/n_programs), deflactando el total real en instituciones con muchos programas. Ahora es una suma NaN-aware real. Corregida 2026-08-17 (segunda vez): restringida a Pregrado — antes sumaba también Posgrado/Postítulo, por lo que una IES con sólo un Magíster/Diplomado en una APDA (ej. UFSM en \"Artes, humanidades y cultura\") mostraba acceso a primer año sin tener oferta de pregrado real ahí. Celdas sin programas de Pregrado ahora quedan en NaN. Comentada en dimensions de Vector/config.yaml y Archetypes/config.yaml el 2026-08-18."

prop_matricula_vacantes_año1:
  dimension: "Tasa ocupación"
  origen: "creada"
  nombre: "Ocupación de vacantes de primer año"
  nombre_corto: "Tasa de ocupación de vacantes"
  descripcion: "Proporción de las vacantes de Pregrado ofertadas en primer año que efectivamente se llenaron con matrícula nueva. Mide qué tan demandado es el programa. Específica de Pregrado: numerador y denominador excluyen Posgrado y Postítulo."
  calculo: "total matrícula primer año / (vacantes semestre uno + vacantes semestre dos), restringida a nivel global == 'Pregrado' (numerador ya viene enmascarado a Pregrado). Definida en Utils/data_prep.py::load_universe."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv (matrícula) + Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv (vacantes)"
  unidad: "razón (matrícula / vacantes)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Corregida 2026-08-17: restringida a Pregrado, mismo motivo que 'total matrícula primer año' (ver notas de esa variable)."

w_jce_doctor:
  dimension: "Cuerpo académico doctor"
  nombre: "Composición doctoral del cuerpo académico (JCE), ponderada"
  descripcion: "Proxy de qué tan doctoral es la composición del cuerpo académico de la institución, a nivel programa. Hasta el 28-07-2026 era una masa absoluta (conteo institucional de JCE con grado de doctor, repartido por matrícula), lo que conflaba tamaño de la institución con composición por grado. Del 28-07-2026 al 12-08-2026 fue una razón (composición) multiplicada por _allocator."
  calculo: "(n_de_jce_por_nivel_de_formacion_doctor / n_de_jce_por_institucion_total_general) × _allocator, donde _allocator excluye matrícula Postítulo del numerador y denominador y divide por n_apda_activas (cobertura de APDAs de la IES) para amortiguar la sobre-asignación a instituciones poco diversificadas; luego reescalada 0-100. Exploration and data completion/Exp_SIES.py, líneas 675-778."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "índice 0-100"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada 2026-08-12: _allocator sigue fabricando varianza intra-IES que ninguna fuente respalda — PAC solo reporta JCE por institución y nivel de formación, nunca por APDA (ver 'Inspection JCE/', Secciones 3-9). Reemplazada por pct_jce_doctor (mismo numerador de composición, sin _allocator). Se mantiene calculada en Exploration and data completion/Exp_SIES.py y dfs/merged_final.csv solo porque Inspection JCE/Exp_JCE_casos.py la usa como baseline documentado."

w_jce_magister:
  dimension: "Cuerpo académico doctor"
  nombre: "Composición de magísteres del cuerpo académico (JCE), ponderada"
  descripcion: "Igual que 'Composición doctoral (JCE)' pero para académicos con grado de magíster."
  calculo: "(n_de_jce_por_nivel_de_formacion_magister / n_de_jce_por_institucion_total_general) × _allocator; reescalada 0-100. Exploration and data completion/Exp_SIES.py, líneas 675-778."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "índice 0-100"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada 2026-08-12, mismo motivo que w_jce_doctor. Reemplazada por pct_jce_magister."

w_jce_especialidad:
  dimension: "Cuerpo académico doctor"
  nombre: "Composición de especialistas médicos/odontológicos del cuerpo académico (JCE), ponderada"
  descripcion: "Igual que 'Composición doctoral (JCE)' pero para académicos con especialidad médica u odontológica."
  calculo: "(n_de_jce_por_nivel_de_formacion_especialidad_medica_u_odontologica / n_de_jce_por_institucion_total_general) × _allocator; reescalada 0-100. Exploration and data completion/Exp_SIES.py, líneas 675-778."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "índice 0-100"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada 2026-08-12, mismo motivo que w_jce_doctor. Reemplazada por pct_jce_especialidad."

pct_jce_doctor:
  dimension: "Cuerpo académico doctor"
  origen: "creada"
  nombre: "% JCE doctor (constante institucional)"
  nombre_corto: "% JCE con doctorado"
  descripcion: "Qué porcentaje del JCE académico total de la institución corresponde a académicos con grado de doctor. Constante por IES: se repite en las cuatro celdas IES×APDA de una misma institución, porque PAC no reporta JCE desglosado por área del conocimiento y ningún alocador probado (ver 'Inspection JCE/', Secciones 3-9) logró repartirlo entre APDA sin fabricar varianza espuria."
  calculo: "n_de_jce_por_nivel_de_formacion_doctor / n_de_jce_por_institucion_total_general × 100. Exploration and data completion/Exp_SIES.py (bloque 'JCE weights'). Constante dentro de IES → agregada por 'first' en Utils/data_prep.py::aggregate_ies_apda_rich."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "% (0-100)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Reemplaza a w_jce_doctor desde el 12-08-2026 — mismo numerador de composición, sin multiplicar por _allocator. Mide composición institucional, no composición por APDA."

pct_jce_magister:
  dimension: "Cuerpo académico doctor"
  origen: "creada"
  nombre: "% JCE magíster (constante institucional)"
  descripcion: "Igual que '% JCE doctor' pero para académicos con grado de magíster (académico y profesional colapsados — la taxonomía SIES/PAC no distingue entre ambos)."
  calculo: "n_de_jce_por_nivel_de_formacion_magister / n_de_jce_por_institucion_total_general × 100. Exploration and data completion/Exp_SIES.py (bloque 'JCE weights')."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "% (0-100)"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Reemplaza a w_jce_magister desde el 12-08-2026. Comentada de nuevo 2026-08-13 en ambos config.yaml (branches) por decisión del usuario, sin reemplazo activo — w_jce_magister también permanece comentada."

pct_jce_especialidad:
  dimension: "Cuerpo académico doctor"
  origen: "creada"
  nombre: "% JCE especialidad médica/odontológica (constante institucional, sólo APDA Salud)"
  descripcion: "Igual que '% JCE doctor' pero para académicos con especialidad médica u odontológica. A diferencia de pct_jce_doctor, desde el 17-08-2026 sólo se puntúa en el APDA 'Salud y bienestar' — es NaN en los otros tres APDA de cada IES, porque el ratio de especialistas médicos/odontológicos no tiene relación con Artes, Ciencias o Educación."
  calculo: "n_de_jce_por_nivel_de_formacion_especialidad_medica_u_odontologica / n_de_jce_por_institucion_total_general × 100, luego .where(apda == 'Salud y bienestar') en Utils/data_prep.py::load_universe. Exploration and data completion/Exp_SIES.py (bloque 'JCE weights')."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_JCE"
  unidad: "% (0-100)"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Reemplaza a w_jce_especialidad desde el 12-08-2026. Acotada al APDA 'Salud y bienestar' desde el 17-08-2026 (antes se repetía sin sentido en los 4 APDA de cada IES, igual que acred_especialidad_medica ya estaba acotada por nivel carrera). Agregada a FORCE_INCLUDE en Utils/data_prep.py porque la cobertura cae a ~25% tras la restricción. Comentada en dimensions de Vector/config.yaml y Archetypes/config.yaml el 2026-08-18."

w_academicos_39:
  dimension: "Cuerpo académico doctor"
  nombre: "Dotación de académicos con 39+ horas contratadas, ponderada"
  descripcion: "Proxy de dedicación docente/investigativa de tiempo casi-completo o completo: cantidad de académicos de la institución contratados por 39 horas semanales o más, repartida a cada programa vía _allocator. Se mantiene como variable independiente de w_jce_doctor pese a su correlación (ρ≈0.90) — JCE es una forma reducida del headcount académico (jornada equivalente vs. conteo de personas), por lo que la correlación es estructuralmente esperable y ambas aportan información distinta (decisión 28-07-2026, sin cambio de fórmula por este motivo)."
  calculo: "N° de académicos con 39+ horas contratadas (institución) × _allocator, donde _allocator excluye matrícula Postítulo y divide por n_apda_activas; reescalada 0-100. Exploration and data completion/Exp_SIES.py, líneas 675-778; agregada en julio 2026, ver Inspection JCE/2026-07-22_pac_academicos39_jce_weighting_acreditacion.md; fórmula del allocator revisada 28-07-2026."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_Número"
  unidad: "índice 0-100"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada 2026-08-13, reemplazada por pct_academicos_39: mismo motivo que w_jce_doctor/magister/especialidad — _allocator fabrica varianza intra-IES que ninguna fuente respalda (PAC solo reporta el headcount 39+ horas a nivel institución, nunca por APDA). Revertida a activa el 13-08-2026 en ambos config.yaml (branches) por decisión del usuario. Retirada de nuevo el 18-08-2026, definitivamente: pct_academicos_39 vuelve a quedar activa en ambos config.yaml."

pct_academicos_39:
  dimension: "JCE"
  origen: "creada"
  nombre: "% académicos con 39+ horas contratadas (constante institucional)"
  nombre_corto: "N° de académicos jornada completa"
  descripcion: "Qué porcentaje del cuerpo académico total de la institución está contratado por 39 horas semanales o más. Constante por IES: se repite en las cuatro celdas IES×APDA de una misma institución, porque PAC no reporta el headcount por rango de horas desglosado por área del conocimiento."
  calculo: "n_de_academicos_por_rango_de_horas_contratadas_entre_39_y_mas / n_de_academicos_por_insitucion_total_general × 100. Exploration and data completion/Exp_SIES.py (bloque 'JCE weights'). Constante dentro de IES → agregada por 'first' en Utils/data_prep.py::aggregate_ies_apda_rich."
  fuente: "SIES PAC web — PAC_web_2008_2025_SIES_EE.xlsx, hoja BD_Académicos_Número"
  unidad: "% (0-100)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Reemplazó a w_academicos_39 el 13-08-2026 — mismo numerador (headcount 39+ horas), sin multiplicar por _allocator. Revertida (comentada de nuevo) el 13-08-2026 en ambos config.yaml (branches) por decisión del usuario. Reactivada definitivamente el 18-08-2026, mismo criterio ya aplicado a pct_jce_doctor/magister/especialidad: se prefiere la constante institucional de la base de datos (no ponderada por _allocator) sobre la versión ponderada."

acred_posgrado:
  dimension: "Acreditación"
  origen: "creada"
  nombre: "Acreditación del programa (posgrado)"
  descripcion: "Indica si el programa de posgrado de la APDA está acreditado. No aplica (NaN) para programas de pregrado."
  calculo: "acred_bin (1 si 'acreditación carrera o programa' no es nula y no contiene 'no acreditada'/'sin acreditación') restringido a nivel global == 'Posgrado'. Utils/data_prep.py, líneas 101-120."
  fuente: "SIES Oferta Académica — Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv"
  unidad: "binario (0/1), promediado a fracción dentro de la celda"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada 2026-08-17: la razón k/n premia denominadores chicos — una IES con 3/3 programas de posgrado acreditados superaba a una con 5/15, pese a tener mucho menos alcance acreditado. Mismo patrón que w_jce_doctor/_allocator (ver 'Inspection JCE/Exp_JCE_casos_texto.md'). Reemplazada por acred_posgrado_ajustado. La columna se eliminó de data_prep.py el 2026-08-18: acred_posgrado_ajustado ya no se deriva de ella, sino de un pipeline propio (ver esa entrada) que además redefine qué cuenta como 'posgrado' (nivel global == 'Posgrado', es decir Magíster + Doctorado, era una definición distinta de la usada en matrícula)."

acred_posgrado_ajustado:
  dimension: "Acreditación"
  origen: "creada"
  nombre: "Acreditación del programa (posgrado), ajustada por escala"
  nombre_corto: "Cobertura acreditación magíster"
  descripcion: "Variable de cobertura: qué proporción de la oferta de posgrado (Magíster + Especialidad Médica U Odontológica) de la celda IES×APDA, vigente y con estudiantes nuevos, está acreditada — ajustada por escala mediante shrinkage bayesiano para que instituciones con pocos programas no superen artificialmente a instituciones con oferta más amplia y acreditada. NaN cuando la institución no tiene oferta vigente de posgrado en esa APDA (ausencia de oferta, no un 0); 0 cuando sí tiene oferta pero ningún programa está acreditado."
  calculo: "Fórmula: acred_posgrado_ajustado = (k + C·m) / (n + C). k = # programas de posgrado acreditados y n = # programas de posgrado en la celda IES×APDA — 'posgrado' = Magíster + Especialidad Médica U Odontológica (mismo universo que prop_matricula_posgrado_apda; Doctorado se puntúa aparte en acred_doctorado_ajustado), deduplicados por cod_carrera (colapsa el fan-out de sede/jornada/versión del grano de master_dataset, acred_bin agregado con max) y restringidos a vigencia == 'Vigente con estudiantes nuevos'. m = tasa de acreditación de posgrado del APDA de esa celda; C = promedio de n entre celdas de ese mismo APDA con n>0. m y C se calculan por APDA por separado (no agrupando las 4 APDAs). Tres estados, nunca por orden de asignación: n=0 -> NaN (sin oferta); n>0 y k=0 -> 0 forzado (oferta sin ningún acreditado, no pasa por la fórmula: un 0/n confirmado no necesita suavizado); n>0 y k>0 -> fórmula de shrinkage. Utils/data_prep.py::add_acred_scores."
  fuente: "SIES Oferta Académica — Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv"
  unidad: "razón ajustada 0-1 (NaN = sin oferta, distinto de 0 = oferta sin acreditar)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Redefinida 2026-08-18: (1) el universo de 'posgrado' pasa de nivel global == 'Posgrado' (Magíster + Doctorado, excluía Especialidad Médica) a Magíster + Especialidad Médica U Odontológica, alineado con prop_matricula_posgrado_apda — Doctorado pasa a puntuarse aparte en acred_doctorado_ajustado; (2) se deduplica por cod_carrera en vez de contar filas (fan-out sede/jornada/versión); (3) se restringe a vigencia == 'Vigente con estudiantes nuevos'. Cobertura real: 147/205 celdas IES×APDA (71,7%), n medio 10,3 programas; 58 celdas sin oferta (NaN) y 57 con oferta pero 0 acreditados (valor 0). k_posgrado_acreditados/n_posgrado_programs se exportan junto a esta variable como trazabilidad — sin ponderación propia en el modelo — y permiten distinguir 'sin oferta' de 'oferta sin acreditar' directamente en los datos, sin depender de interpretar el NaN. Movida 2026-08-26 de 'Acreditación doctorado' (ex 'Acreditación', eje Investigación) a 'Acreditación' (ex 'Acreditación Trayectoria', eje Docencia): la cobertura de magíster se agrupa con la señal de trayectoria en vez de con doctorado."

acred_doctorado_ajustado:
  dimension: "Acreditación doctorado"
  origen: "creada"
  nombre: "Acreditación del programa (doctorado), ajustada por escala"
  nombre_corto: "Cobertura acreditación doctorado"
  descripcion: "Variable de cobertura: qué proporción de la oferta de Doctorado de la celda IES×APDA, vigente y con estudiantes nuevos, está acreditada — ajustada por escala mediante shrinkage bayesiano, mismo criterio que acred_posgrado_ajustado. NaN cuando la institución no tiene oferta vigente de doctorado en esa APDA (ausencia de oferta, no un 0); 0 cuando sí tiene oferta pero ningún programa está acreditado."
  calculo: "Fórmula: acred_doctorado_ajustado = (k + C·m) / (n + C). k = # programas de doctorado acreditados y n = # programas de doctorado en la celda IES×APDA, deduplicados por cod_carrera (acred_bin agregado con max) y restringidos a vigencia == 'Vigente con estudiantes nuevos'. m = tasa de acreditación de doctorado del APDA de esa celda; C = promedio de n entre celdas de ese mismo APDA con n>0, ambos calculados por APDA por separado — mismo mecanismo que acred_posgrado_ajustado. Tres estados: n=0 -> NaN (sin oferta); n>0 y k=0 -> 0 forzado (oferta sin ningún acreditado); n>0 y k>0 -> fórmula de shrinkage. Utils/data_prep.py::add_acred_scores."
  fuente: "SIES Oferta Académica — Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv"
  unidad: "razón ajustada 0-1 (NaN = sin oferta, distinto de 0 = oferta sin acreditar)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Añadida 2026-08-18 junto con el rediseño de acred_posgrado_ajustado: el doctorado no estaba representado en la dimensión Acreditación pese a tener la mayor tasa de acreditación de los tres niveles (0,78, frente a 0,40 en posgrado y 0,28 en especialidad médica). Cobertura real: 101/205 celdas IES×APDA (49,3%), n medio 3,6 programas; 104 celdas sin oferta (NaN) y 18 con oferta pero 0 acreditados (valor 0). k_doctorado_acreditados/n_doctorado_programs se exportan como trazabilidad, mismo patrón que acred_posgrado_ajustado. Dimensión renombrada 2026-08-26 de 'Acreditación' a 'Acreditación doctorado' cuando acred_posgrado_ajustado se movió fuera de ella."

acred_especialidad_medica:
  dimension: "Acreditación"
  origen: "creada"
  nombre: "Acreditación del programa (especialidad médica/odontológica)"
  nombre_corto: "Cobertura acreditación de programas Esp. médica/odontológica"
  descripcion: "Variable de cobertura, acotada al APDA de Salud y bienestar: qué proporción de los programas de especialidad médica u odontológica de la institución, vigentes y con estudiantes nuevos, está acreditada. NaN fuera de Salud y bienestar y para instituciones sin oferta vigente de especialidades en esa APDA (ausencia de oferta, no un 0); 0 cuando sí tiene oferta pero ninguna especialidad está acreditada."
  calculo: "Fórmula: acred_especialidad_medica = k / n (razón cruda, sin shrinkage — n promedia ~24 programas por celda, fuera del régimen de denominador chico que motiva el ajuste bayesiano de acred_posgrado_ajustado/acred_doctorado_ajustado). k = # programas de especialidad médica u odontológica acreditados y n = # de esos mismos programas en la celda IES×APDA, deduplicados por cod_carrera (acred_bin agregado con max) y restringidos a vigencia == 'Vigente con estudiantes nuevos'. Máscara adicional: forzado a NaN fuera de apda == 'Salud y bienestar' (en la práctica ya 100% acotado ahí por nivel carrera, verificado sobre datos reales; la máscara documenta la intención y protege ante un futuro remapeo de APDA). Utils/data_prep.py::add_acred_scores."
  fuente: "SIES Oferta Académica — Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv"
  unidad: "razón 0-1 (NaN = sin oferta o fuera de Salud y bienestar, distinto de 0 = oferta sin acreditar)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Movida 2026-08-18 de la dimensión 'Acreditación' (eje Investigación) a 'Trayectoria programa' (eje Docencia): mide calidad de la oferta docente de especialidades médicas, no capacidad investigativa. Redefinida el mismo día con el mismo criterio que acred_posgrado_ajustado: deduplicación por cod_carrera + filtro de vigencia (antes contaba filas de cualquier vigencia, sin deduplicar). Cobertura real: 21/205 celdas IES×APDA (10,2%), todas en Salud y bienestar; n medio 24,3 programas; 184 celdas sin oferta o fuera de Salud (NaN) y 3 con oferta pero 0 acreditadas (valor 0). k_especialidad_acreditadas/n_especialidad_programs se exportan como trazabilidad. Dimensión 'Acreditación Trayectoria' renombrada 2026-08-26 a 'Acreditación', ganando acred_posgrado_ajustado."

paridad_matricula:
  dimension: "Matrícula"
  origen: "creada"
  nombre: "Paridad de género — matrícula total"
  nombre_corto: "Paridad de género (matrícula)"
  descripcion: "Qué tan equilibrada está la matrícula total de la APDA entre hombres y mujeres. El score es máximo cuando la participación femenina está entre 40% y 60%, y decae hacia 0 en los extremos (0% o 100% mujeres)."
  calculo: "Participación femenina = suma de matrícula mujeres / (suma mujeres + suma hombres) en toda la celda IES×APDA (ponderada por matrícula real de cada programa, no promedio simple de proporciones), luego banda trapezoidal 40-60%. Utils/data_prep.py::add_parity_scores/_parity_score, líneas 460-521."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv"
  unidad: "score 0-100"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Reemplazó a pct_matricula_hombres/pct_matricula_mujeres como par de variables independientes: en vez de premiar linealmente un solo sexo, penaliza cuando la matrícula se aleja de un rango de equilibrio 40-60%."

paridad_matricula_primer_año:
  dimension: "Matrícula"
  origen: "creada"
  nombre: "Paridad de género — matrícula de primer año"
  nombre_corto: "Paridad de género (primer año)"
  descripcion: "Igual que 'Paridad de género — matrícula total' pero calculada solo sobre la cohorte de primer año."
  calculo: "Misma banda trapezoidal 40-60% aplicada a la participación femenina en matrícula de primer año, ponderada por celda. Utils/data_prep.py::add_parity_scores/_parity_score, líneas 460-521."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv"
  unidad: "score 0-100"
  orientacion: "mayor_es_mejor"
  estado: "activa"

prop_matricula_posgrado_ies:
  dimension: "Matrícula"
  origen: "creada"
  nombre: "Participación de posgrado en la institución"
  descripcion: "Qué proporción de toda la matrícula de la institución (todas las APDAs y niveles) corresponde a programas de posgrado. Es un atributo de la institución, no de la APDA específica — el mismo valor se repite en todas las APDAs de una misma IES."
  calculo: "Suma de matrícula en programas de posgrado / matrícula total de la IES, calculada una vez por institución y difundida a todas sus filas. Build_master_dataset.py, líneas 104-128."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada 2026-08-18: era institution-constant (broadcast del mismo valor a todas las APDAs de la IES), sin variación real intra-institución. Reemplazada por prop_matricula_posgrado_apda, una razón real por celda IES×APDA (Utils/data_prep.py::add_prop_matricula_posgrado_apda). El cálculo original queda en Build_master_dataset.py sin usarse, por continuidad."

prop_matricula_posgrado_apda:
  dimension: "Matrícula"
  origen: "creada"
  nombre: "Participación de posgrado en la APDA"
  nombre_corto: "Participación de posgrado"
  descripcion: "Dentro de esta APDA de la institución, qué proporción de la matrícula corresponde a programas de posgrado (Magíster + Especialidad Médica u Odontológica). A diferencia de la retirada prop_matricula_posgrado_ies, varía entre APDAs de una misma IES."
  calculo: "Suma de 'total matrícula' en programas con nivel carrera en {Magister, Especialidad Médica U Odontológica}, agrupada por celda IES×APDA, dividida por la suma de 'total matrícula' de todos los programas (cualquier nivel) de esa misma celda. Utils/data_prep.py::add_prop_matricula_posgrado_apda."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv + Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv (nivel carrera)"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
  estado: "activa"

prop_matricula_doctorado_apda:
  dimension: "Matrícula Doctorado"
  origen: "creada"
  nombre: "Participación de doctorado dentro del posgrado de la APDA"
  nombre_corto: "Participación de doctorado"
  descripcion: "Dentro de la matrícula de posgrado de esta APDA (Magíster + Especialidad Médica u Odontológica), qué proporción corresponde específicamente a programas de Doctorado. NaN en celdas sin matrícula de Magíster/Especialidad Médica (sin población de posgrado con la que comparar)."
  calculo: "Suma de 'total matrícula' en programas con nivel carrera == 'Doctorado', agrupada por celda IES×APDA, dividida por la misma suma de Magíster + Especialidad Médica U Odontológica usada como numerador de prop_matricula_posgrado_apda. Utils/data_prep.py::add_prop_matricula_posgrado_apda."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv + Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv (nivel carrera)"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
