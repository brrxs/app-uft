promedio_puntaje_apda:
  dimension: "Selectividad"
  origen: "creada"
  nombre: "Puntaje promedio de ingreso (por celda IES×APDA)"
  nombre_corto: "Puntaje promedio Lenguaje y Matemática (M1)"
  descripcion: "Puntaje promedio de ingreso (PSU/PAES) agregado a nivel IES×APDA: media simple, sin ponderar, entre los programas distintos de esa celda que tienen proceso de selección centralizado. Reemplaza a promedio_puntaje, evitando que la composición de jornadas/sedes de una carrera sesgue el resultado."
  calculo: "Match CNED ampliado a institución×sede×carrera (I/S/C, sin jornada/versión) en Build_master_dataset.py — sube la cobertura de programas de 22.3% a 29.3% (donde ambos grados de match coinciden, acuerdan en 99.5% de los casos). Sobre ese universo, se deduplica a un valor por (IES×APDA, I/S/C) y se promedia sin ponderar por celda. Utils/data_prep.py::add_puntaje_seleccion."
  fuente: "CNED — BaseINDICES-2005-2025.xlsx"
  unidad: "puntaje PSU/PAES"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Celdas sin ningún programa con proceso de selección centralizado quedan en NaN (mismo criterio 'sin oferta' que acred_posgrado_ajustado), no en 0. n_puntaje_programs (cantidad de programas I/S/C distintos que aportan a la celda) se exporta como columna de trazabilidad — NaN en la variable ⇔ n_puntaje_programs == 0."

puntaje_corte_apda:
  dimension: "Selectividad"
  origen: "creada"
  nombre: "Puntaje de corte (por celda IES×APDA)"
  nombre_corto: "Puntaje de corte"
  descripcion: "Puntaje de corte de la última vacante regular, agregado a nivel IES×APDA: media simple, sin ponderar, entre los programas distintos de esa celda que tienen proceso de selección centralizado. Reemplaza a puntaje_corte, mismo criterio que promedio_puntaje_apda."
  calculo: "Idéntico a promedio_puntaje_apda (mismo match ampliado a I/S/C, mismo dedup, misma media simple), aplicado a 'Puntaje de corte (promedio de la carrera)'. Utils/data_prep.py::add_puntaje_seleccion."
  fuente: "CNED — BaseINDICES-2005-2025.xlsx"
  unidad: "puntaje PSU/PAES"
  orientacion: "mayor_es_mejor"
  estado: "activa"
