anid_apda_monto_mean_activos:
  dimension: "Investigación ANID (APDA)"
  origen: "recolectada"
  nombre: "Monto ANID promedio (todos los fondos, activos 2025)"
  nombre_corto: "Media montos ANID"
  descripcion: "Monto promedio adjudicado por proyectos ANID activos durante 2025 (incluye proyectos plurianuales adjudicados en años anteriores aún vigentes), entre todos los tipos de fondo, agregado a nivel IES×APDA."
  calculo: "Promedio de MONTO_ADJUDICADO de proyectos ANID con AGNO_FALLO <= 2025 <= agno_fin, agrupados por ies_norm + apda, donde agno_fin = AGNO_FALLO + ceil(duración imputada en meses / 12) − 1. La duración se imputa (mediana por PROGRAMA+INSTRUMENTO, o por PROGRAMA si esa combinación no tiene comparables) cuando DURACION_MESES es nula (~4.8% de las filas). Exploration and data completion/Exp_ANID.py, líneas 41-64 (imputación y ventana) y función _aggregate_view (vista anid_univ_activos), líneas 173-217."
  fuente: "ANID — BDH_HISTORICA.xlsx"
  unidad: "CLP"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Activada en el puntaje el 2026-08-03 en reemplazo de anid_apda_monto_mean_adjudicados: mide el portafolio ANID vigente durante 2025 (mejor cobertura — 220 vs 177 celdas IES×APDA con dato — y menos imputación). Ojo con la unidad: MONTO_ADJUDICADO es el monto total del proyecto, así que el promedio mezcla montos plurianuales completos y NO representa el gasto del año 2025. Se evaluó una variante anualizada (monto / duración en años) y se decidió no construirla por ahora."

