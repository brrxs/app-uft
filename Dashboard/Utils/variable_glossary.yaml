  calculo: "n_2025 (matriculados año 2 de la cohorte 2024) / n_2024 (matriculados año 1 de la cohorte 2024), agrupado por código único de programa. Exploration and data completion/Exp_SIES.py, líneas 577-593."
  fuente: "Retención — trayectoria_universidades.csv"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
