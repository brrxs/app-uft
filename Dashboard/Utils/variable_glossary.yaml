sobreduracion_meses:
  dimension: "Trayectoria"
  origen: "creada"
  nombre: "Sobreduración de titulación (meses)"
  nombre_corto: "Sobreduración (meses)"
  descripcion: "Exceso, en meses, de la duración real observada en titulados por sobre la duración nominal declarada en la oferta académica del programa. Solo se calcula para niveles de carrera donde el concepto de titulación aplica de forma comparable."
  calculo: "(duracion_titulados_mean en años × 2 − duración total en semestres) × 6, excluyendo Bachillerato/Ciclo Inicial, Profesional Sin Licenciatura y Técnico de Nivel Superior. Utils/data_prep.py, líneas 145-161."
  fuente: "MINEDUC Titulados (duración empírica) + SIES Oferta Académica (duración nominal)"
  unidad: "meses"
  orientacion: "menor_es_mejor"
  estado: "activa"
  notas: "direction: -1 en los config.yaml — menos sobreduración puntúa mejor. Ver también Vector/export_sobreduracion_uft.py (export ad-hoc a nivel programa para UFT)."

empleabilidad_pond_1er_año:
  dimension: "Empleabilidad"
  origen: "recolectada"
  nombre: "Empleabilidad al 1er año (ponderada por titulados)"
  nombre_corto: "Empleabilidad al 1er año"
  descripcion: "Proporción de titulados del programa que registran cotizaciones (empleo formal) durante el primer año tras la titulación, agregada a nivel IES×APDA ponderando cada carrera genérica por su volumen real de egresados en vez de por su matrícula."
  calculo: "Match (cod_inst, nombre_carrera normalizado) contra el Buscador de Empleabilidad SIES (la fuente no publica sede/jornada/versión, así que un mismo valor se replica sobre todas las filas de programa que difieren en esas dimensiones). Agregación IES×APDA: F = Σ_g emp_g·T_g, N = Σ_g T_g sobre las carreras genéricas g de la celda con empleabilidad no nula; valor = F/N. T_g = titulados de esa (institución, carrera genérica) sumados en 2024+2023+2022 (dfs/catalogos/titulados_generica.csv, construido por Exp_Titulados_Generica.py a partir de MINEDUC Titulados Ed. Superior). Antes de sumar, se colapsa el fan-out sede/jornada/versión del match (empleabilidad es constante dentro de esa unidad) y se deduplica por carrera genérica, para no contar dos veces el mismo T_g. Si Σ T_g = 0 en la celda, cae a media simple de emp_g. Utils/data_prep.py::add_empleabilidad_ponderada."
  fuente: "SIES — Buscador_Empleabilidad_ingresos_2025_2026_SIES (1).xlsx + MINEDUC Titulados Ed. Superior 2022-2024 + SIES Matrícula (mapa carrera→genérica)"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Reemplaza a empleabilidad_1er_año (retirada) en dimensions: de ambos config.yaml desde 2026-08-13. Misma cobertura de celdas IES×APDA que la variable retirada (161/204, 78.9%) — el cambio de peso no altera qué celdas tienen dato, sólo cómo se combinan los valores de sus carreras genéricas. Correlación con la versión ponderada por matrícula ≈0.97; delta típico pequeño, con algunas celdas que se mueven hasta ~0.2 cuando el peso de titulados diverge fuerte del de matrícula."

empleabilidad_pond_2do_año:
  dimension: "Empleabilidad"
  origen: "recolectada"
  nombre: "Empleabilidad al 2° año (ponderada por titulados)"
  nombre_corto: "Empleabilidad al 2do año"
  descripcion: "Proporción de titulados del programa que registran cotizaciones (empleo formal) durante el segundo año tras la titulación, agregada a nivel IES×APDA ponderando cada carrera genérica por su volumen real de egresados en vez de por su matrícula."
  calculo: "Igual método que empleabilidad_pond_1er_año, con T_g = titulados de esa (institución, carrera genérica) sumados en 2023+2022+2021 — ventana desplazada un año, alineada a la cohorte que empleabilidad_2do_año mide (un año después de titulación). Utils/data_prep.py::add_empleabilidad_ponderada."
  fuente: "SIES — Buscador_Empleabilidad_ingresos_2025_2026_SIES (1).xlsx + MINEDUC Titulados Ed. Superior 2021-2023 + SIES Matrícula (mapa carrera→genérica)"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Reemplaza a empleabilidad_2do_año (retirada) en dimensions: de ambos config.yaml desde 2026-08-13. Misma cobertura que la variable retirada (156/204, algo menor que 1er año porque el segundo año post-titulación tiene más 's/i' en la fuente SIES)."

continuidad_estudios:
  dimension: "Empleabilidad"
  origen: "recolectada"
  nombre: "Continuidad de estudios de titulados"
  nombre_corto: "Continuidad de estudios"
  descripcion: "Proporción de titulados del programa que continúan estudios formales (otro programa de educación superior) en vez de incorporarse al mercado laboral."
  calculo: "Igual método de match y agregación que empleabilidad_1er_año, sobre la columna '% titulados con continuidad de estudios' del Buscador de Empleabilidad SIES."
  fuente: "SIES — Buscador_Empleabilidad_ingresos_2025_2026_SIES (1).xlsx"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
  estado: "activa"
  notas: "Cobertura parcial, igual a empleabilidad_1er_año (161/204 celdas). Ver 'Inspection Empleabilidad/'. Movida 2026-08-26 de la dimensión 'Trayectoria' a 'Empleabilidad'."

# ─────────────────────────────────────────────────────────────────────────
# Variables retiradas (comentadas en dimensions:/direction: de los config.yaml)
# ─────────────────────────────────────────────────────────────────────────

empleabilidad_1er_año:
  dimension: "Empleabilidad"
  nombre: "Empleabilidad al 1er año"
  descripcion: "Proporción de titulados del programa que registran cotizaciones (empleo formal) durante el primer año tras la titulación."
  calculo: "Match (cod_inst, nombre_carrera normalizado) contra el Buscador de Empleabilidad SIES — la fuente no publica sede/jornada/versión, así que un mismo valor se replica sobre todas las filas de programa que difieren en esas dimensiones. Agregación IES×APDA por media ponderada por matrícula, NaN-aware (Utils/data_prep.py::aggregate_ies_apda_rich, WEIGHTED_FEATS_PREFIXES)."
  fuente: "SIES — Buscador_Empleabilidad_ingresos_2025_2026_SIES (1).xlsx"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
  estado: "retirada"
  notas: "Retirada de dimensions: en ambos config.yaml el 2026-08-13, en favor de empleabilidad_pond_1er_año (ponderada por titulados de la carrera genérica en vez de por matrícula del programa). La columna sigue calculándose en ies_apda_features.csv (WEIGHTED_FEATS_PREFIXES en data_prep.py no cambió), pero ya no entra al scoring. Ver 'Inspection Empleabilidad/' para el análisis original de cobertura y duplicación."

empleabilidad_2do_año:
  dimension: "Empleabilidad"
  nombre: "Empleabilidad al 2° año"
