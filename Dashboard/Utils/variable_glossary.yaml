prop_matricula_especialidad_apda:
  dimension: "Matrícula Especialidades"
  origen: "creada"
  nombre: "Participación de especialidad médica dentro del posgrado de la APDA"
  nombre_corto: "Participación de especialidad médica"
  descripcion: "Dentro de la matrícula de posgrado de esta APDA (Magíster + Especialidad Médica u Odontológica), qué proporción corresponde específicamente a Especialidad Médica U Odontológica. Sólo se puntúa en el APDA 'Salud y bienestar' — es NaN en los otros tres APDA de cada IES, porque este nivel carrera no existe fuera de Salud. Confirmada 2026-09-07 en el eje Docencia (y) vía axes_by_apda en Vector/config.yaml."
  calculo: "Suma de 'total matrícula' en programas con nivel carrera == 'Especialidad Médica U Odontológica', agrupada por celda IES×APDA, dividida por la misma suma de Magíster + Especialidad Médica U Odontológica usada como denominador de prop_matricula_doctorado_apda, luego .where(apda == 'Salud y bienestar'). Utils/data_prep.py::add_prop_matricula_posgrado_apda."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv + Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv (nivel carrera)"
  unidad: "proporción (0-1)"
  orientacion: "mayor_es_mejor"
  estado: "activa"

arancel_anual_index:
  dimension: "Costo"
  origen: "creada"
  nombre: "Índice de costo relativo (arancel anual)"
  nombre_corto: "Índice de costo (arancel)"
  descripcion: "Qué tan caro o barato es el arancel anual del programa en comparación con el resto de programas de su misma APDA. Un valor negativo indica un arancel más barato que el promedio de la APDA; positivo, más caro."
  calculo: "Se centra el arancel anual en la media de la APDA (→0) y se escala por la distancia al máximo de la APDA (si está sobre la media) o al mínimo (si está bajo la media), acotando a [-1, 1]. Utils/data_prep.py, líneas 129-136."
  fuente: "SIES Oferta Académica — Oferta_Academica_2010_al_2025_SIES_02_06_2025_WEB_E.csv"
  unidad: "índice adimensional [-1, 1]"
  orientacion: "menor_es_mejor"
  estado: "activa"
  notas: "direction: -1 en los config.yaml — un arancel más bajo puntúa mejor. Vivió en la dimensión 'Trayectoria' desde que se eliminó la dimensión 'Costo' original el 2026-08-24; el 2026-08-26 volvió a su propia dimensión 'Costo' (reinstalada), con 5 pts de peso del eje Docencia tomados de 'Trayectoria'."

pct_tes_particular_pagado_apda:
  dimension: "Costo"
  origen: "creada"
  nombre: "% de estudiantes de establecimiento particular pagado (TES)"
  nombre_corto: "% TES particular pagado"
  descripcion: "Dentro de esta APDA de la institución, qué porcentaje de los estudiantes con dependencia de origen (TES) conocida vienen de un establecimiento secundario particular pagado. Proxy del perfil socioeconómico del estudiantado, usado como señal de costo/accesibilidad complementaria al arancel."
  calculo: "Se colapsan primero las filas de programa a nivel I/S/C/J (institución×sede×carrera×jornada, ignorando versión) sumando 'tes particular pagado' y 'total tes'; luego esos totales por programa se suman a nivel IES×APDA y se divide 100 × suma(tes particular pagado) / suma(total tes). Utils/data_prep.py::add_pct_tes_particular_pagado_apda."
  fuente: "SIES — Matricula_2007_2025_WEB_15_07_2025.csv (columnas TES)"
  unidad: "porcentaje (0-100)"
  orientacion: "menor_es_mejor"
  estado: "activa"
  notas: "direction: -1 en los config.yaml — mayor % de origen particular pagado puntúa peor (menos accesible/más caro). Numerador restringido a TES PARTICULAR PAGADO (no incluye PARTICULAR SUBVENCIONADO), por decisión explícita al definir la variable."

anid_apda_monto_mean_adjudicados:
