scimago_apda_score_w:
  dimension: "Producción Científica (APDA)"
  origen: "creada"
  nombre: "Score SCImago (ponderado por cobertura)"
  nombre_corto: "Ranking Scimago"
  descripcion: "Desempeño en rankings de investigación SCImago de la institución en las disciplinas asociadas a la APDA. Penaliza a instituciones que no aparecen rankeadas en alguna disciplina de la APDA (se les asigna 0 en esa disciplina en vez de excluirlas)."
  calculo: "Para cada disciplina SCImago mapeada a la APDA: pct_score = (n_disciplinas − ranking + 1) / n_disciplinas × 100 (mayor ranking relativo = mejor). Se promedia entre disciplinas y se multiplica por un ratio de cobertura (fracción de disciplinas de la APDA en que la institución aparece rankeada). Exploration and data completion/Exp_SCIMAGO.py, líneas 61-90."
  fuente: "SCImago — chilean_universities_subject_ranks.csv"
  unidad: "score 0-100"
  orientacion: "mayor_es_mejor"
  estado: "activa"

scival_apda_papers:
