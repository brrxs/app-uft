  descripcion: "Cantidad de publicaciones (papers) de la institución en las disciplinas SciVal asociadas a la APDA."
  calculo: "Suma de 'valor_corregido_2025' (conteo de papers) entre las disciplinas SciVal mapeadas a la APDA, por IES×APDA. Exploration and data completion/Exp_SCIVAL.py, líneas 71-76."
  fuente: "SciVal — scival_subject_corrected_2025.csv"
