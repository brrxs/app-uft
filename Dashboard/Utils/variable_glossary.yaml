  calculo: "Promedio de MONTO_ADJUDICADO restringido a la categoría 'otros fondos' con AGNO_FALLO==2025, agrupado por ies_norm + apda. Exploration and data completion/Exp_ANID.py, función _aggregate_view (vista anid_univ_adjudicados), líneas 173-217."
